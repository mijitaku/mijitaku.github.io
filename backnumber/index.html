<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f6"><title>Back Number | 月刊身仕度</title><meta name="description" content="月刊『身仕度』公式サイト"><link rel="icon" href="../assets/images/logo.png"><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="sub-header"><a class="sub-logo" href="../" aria-label="トップページに戻る"><img src="../assets/images/logo.png" alt="身仕度"></a></header><main class="page-main"><h1 class="page-title">Back Number</h1><div class="back-grid" id="backGrid"></div></main><footer class="site-footer"><a href="https://x.com/spoon_essei?s=11&t=mtYJcxfOAP7XxACw2ptSOg" target="_blank" rel="noopener">公式 X</a><a href="https://linktr.ee/mijitaku?utm_source=linktree_profile_share&ltsid=70819a67-adbf-4efd-b8b4-9178348bd3d5" target="_blank" rel="noopener">Linktree</a></footer><script src="../site-data.js"></script><script>const d=window.MIJITAKU_SITE_DATA;const grid=document.querySelector('#backGrid');const GC_ORIGIN='https://mijitaku.goatcounter.com';function formatIssueViews(v){const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?String(n).padStart(2,'0'):'00'}async function loadIssueViews(id,el){try{const p=encodeURIComponent(`/issue/${id}`);const r=await fetch(`${GC_ORIGIN}/counter/${p}.json`,{cache:'no-store'});if(!r.ok)return;const j=await r.json();el.textContent=`👀${formatIssueViews(j.count)}`}catch(e){console.debug('[issue count]',e)}}d.issues.filter(i=>!i.latest).forEach(i=>{const c=document.createElement('article');c.className='issue-card';const href=`../viewer/#${i.id}/1`;c.innerHTML=`<a class="issue-cover-link" href="${href}"><img loading="lazy" src="../viewer/issues/${i.folder}/p-01.webp" alt="${i.short} 表紙"></a><div class="issue-meta"><div class="issue-name">${i.short}</div><div class="issue-actions"><span class="issue-view-count" aria-label="閲覧数">👀00</span><a class="issue-read" href="${href}">読む</a></div></div>`;grid.appendChild(c);loadIssueViews(i.id,c.querySelector('.issue-view-count'))});</script></body></html>
